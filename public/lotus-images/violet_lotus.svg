<svg viewBox="0 0 200 200" class="lotus lotus-10 lotus-spin" xmlns="http://www.w3.org/2000/svg">
  <style>
    .spin {
      animation: spin 10s linear infinite;
      transform-origin: 100px 100px;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>

  <!-- Spinning Lotus (group of petals centered on 100,100) -->
  <g class="spin">
    <g transform="translate(100,100)">
    <!-- 16 petals at 22.5° intervals -->
    <ellipse rx="12" ry="40" fill="indigo" transform="rotate(0)" />
    <ellipse rx="12" ry="40" fill="indigo" transform="rotate(22.5)" />
    <ellipse rx="12" ry="40" fill="indigo" transform="rotate(45)" />
    <ellipse rx="12" ry="40" fill="indigo" transform="rotate(67.5)" />
    <ellipse rx="12" ry="40" fill="indigo" transform="rotate(90)" />
    <ellipse rx="12" ry="40" fill="indigo" transform="rotate(112.5)" />
    <ellipse rx="12" ry="40" fill="indigo" transform="rotate(135)" />
    <ellipse rx="12" ry="40" fill="indigo" transform="rotate(157.5)" />
    <ellipse rx="12" ry="40" fill="indigo" transform="rotate(180)" />
    <ellipse rx="12" ry="40" fill="indigo" transform="rotate(202.5)" />
    <ellipse rx="12" ry="40" fill="indigo" transform="rotate(225)" />
    <ellipse rx="12" ry="40" fill="indigo" transform="rotate(247.5)" />
    <ellipse rx="12" ry="40" fill="indigo" transform="rotate(270)" />
    <ellipse rx="12" ry="40" fill="indigo" transform="rotate(292.5)" />
    <ellipse rx="12" ry="40" fill="indigo" transform="rotate(315)" />
    <ellipse rx="12" ry="40" fill="indigo" transform="rotate(337.5)" />
  </g>
  </g>
    <circle cx="100" cy="100" r="12" fill="black" />
</svg>

