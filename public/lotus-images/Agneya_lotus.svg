<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Two white petals, each rotated ±45° around the base point -->
  <g fill="#ffffff" stroke="#b3b3b3" stroke-width="2" stroke-linejoin="round">
    <path d="M100 120 C 90 90, 95 60, 100 40 C 105 60, 110 90, 100 120 Z"
          transform="rotate(-45 100 120)"/>
    <path d="M100 120 C 90 90, 95 60, 100 40 C 105 60, 110 90, 100 120 Z"
          transform="rotate(45 100 120)"/>
  </g>
  <circle cx="100" cy="120" r="5" fill="black" />
</svg>
