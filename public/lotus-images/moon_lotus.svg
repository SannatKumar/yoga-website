<svg viewBox="0 0 200 200" class="lotus lotus-10 lotus-spin" xmlns="http://www.w3.org/2000/svg">
  <style>
    .spin {
      animation: spin 10s linear infinite;
      transform-origin: 100px 100px;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>

  <!-- Spinning Lotus (group of petals centered on 100,100) -->
  <g class="spin">
    <g transform="translate(100,100)">
    <ellipse rx="20" ry="50" fill="#E5E4E2" transform="rotate(0)" />
    <ellipse rx="20" ry="50" fill="#E5E4E2" transform="rotate(60)" />
    <ellipse rx="20" ry="50" fill="#E5E4E2" transform="rotate(120)" />
    <ellipse rx="20" ry="50" fill="#E5E4E2" transform="rotate(180)" />
    <ellipse rx="20" ry="50" fill="#E5E4E2" transform="rotate(240)" />
    <ellipse rx="20" ry="50" fill="#E5E4E2" transform="rotate(300)" />
  </g>
  </g>
    <circle cx="100" cy="100" r="12" fill="black" />
</svg>
