<svg width="128" height="128" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="moonTitle">
  <title id="moonTitle">Crescent moon</title>
  <!-- Use a mask to cut a crescent from a circle -->
  <defs>
    <mask id="cutout">
      <!-- Everything white is kept; black is removed -->
      <rect width="64" height="64" fill="white"/>
      <!-- The inner (cutting) circle -->
      <circle cx="40" cy="26" r="18" fill="black"/>
    </mask>
  </defs>
  <!-- Outer moon circle, masked to form a crescent -->
  <circle cx="28" cy="32" r="22" fill="#DAD9D7" mask="url(#cutout)"/>
</svg>
