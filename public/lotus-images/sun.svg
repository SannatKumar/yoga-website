<svg width="128" height="128" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sunTitle">
  <title id="sunTitle">Sun with rays</title>
  <!-- Core -->
  <circle cx="32" cy="32" r="12" fill="#FFFF00"/>
  <!-- Rays -->
  <g stroke="#FFFF00" stroke-width="1" stroke-linecap="round">
    <!-- Cardinal -->
    <line x1="32" y1="3"  x2="32" y2="12"/>
    <line x1="32" y1="52" x2="32" y2="61"/>
    <line x1="3"  y1="32" x2="12" y2="32"/>
    <line x1="52" y1="32" x2="61" y2="32"/>
    <!-- Diagonals -->
    <line x1="12.9" y1="12.9" x2="18.9" y2="18.9"/>
    <line x1="45.1" y1="45.1" x2="51.1" y2="51.1"/>
    <line x1="12.9" y1="51.1" x2="18.9" y2="45.1"/>
    <line x1="45.1" y1="18.9" x2="51.1" y2="12.9"/>

    <!-- <line x1="42" y1="6"  x2="39" y2="18"/>
    <line x1="42" y1="52" x2="37" y2="61"/>
    <line x1="3"  y1="32" x2="12" y2="32"/>
    <line x1="52" y1="32" x2="61" y2="32"/> -->

    <!-- Example new ray at 22.5° -->
<line 
  x1="32" y1="32" 
  x2="32 + 29 * cos(22.5°)" 
  y2="32 - 29 * sin(22.5°)" />

     <!-- Example new ray at 22.5° -->
<line 
  x1="132" y1="132" 
  x2="32 + 19 * cos(22.5°)" 
  y2="32 - 19 * sin(22.5°)" />

  <line 
  x1="232" y1="232" 
  x2="32 + 30 * cos(22.5°)" 
  y2="32 - 30 * sin(22.5°)" />

  </g>
</svg>
