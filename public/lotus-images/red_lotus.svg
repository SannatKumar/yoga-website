<svg viewBox="0 0 200 200" class="lotus lotus-10 lotus-spin" xmlns="http://www.w3.org/2000/svg">
  <style>
    .spin {
      animation: spin 10s linear infinite;
      transform-origin: 100px 100px;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>

  <!-- Spinning Lotus (group of petals centered on 100,100) -->
  <g class="spin">
    <g transform="translate(100,100)">
        <!-- 10 petals at 36° intervals -->
        <ellipse rx="15" ry="45" fill="red" transform="rotate(0)" />
        <ellipse rx="15" ry="45" fill="red" transform="rotate(36)" />
        <ellipse rx="15" ry="45" fill="red" transform="rotate(72)" />
        <ellipse rx="15" ry="45" fill="red" transform="rotate(108)" />
        <ellipse rx="15" ry="45" fill="red" transform="rotate(144)" />
        <ellipse rx="15" ry="45" fill="red" transform="rotate(180)" />
        <ellipse rx="15" ry="45" fill="red" transform="rotate(216)" />
        <ellipse rx="15" ry="45" fill="red" transform="rotate(252)" />
        <ellipse rx="15" ry="45" fill="red" transform="rotate(288)" />
        <ellipse rx="15" ry="45" fill="red" transform="rotate(324)" />
      </g>
  </g>
  <circle cx="100" cy="100" r="12" fill="black" />
</svg>
